{{ define "main" }}

<section class="about">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="about-me-text">
          <h3>O naju</h3>
          <p> {{ .Site.Data.about.description | markdownify }}</p>
        </div>
        <hr>
      </div>


      <div class="about-me mt-5 col-lg-6">
        <img class="about-me-image actor mb-3" src="{{ .Site.Params.authorThumb | absURL}}" alt="image">
        <h4>{{ .Site.Params.author }}</h4>
        <p>{{ .Site.Data.about.description_tomaz }} </p>
        </p>
        <h6>Pofočkaj me na social</h6>
        <ul class="soicel-icon">

          <li> <a href="https://www.instagram.com/{{ .Site.Params.instaUsername }}" target="_blank"><i
                class="fa fa-instagram"></i></a>
          </li>
          <li> <a href="https://www.youtube.com/{{ .Site.Params.youTubeUsername }}" target="_blank"><i
                class="fa fa-youtube-play"></i></a>
          </li>
        </ul>
      </div>
      <div class="about-me mt-5 col-lg-6">
        <img class="about-me-image actor mb-3" src="{{ .Site.Params.masaThumb | absURL}}" alt="image">
        <h4>{{ .Site.Params.masaAuthor }}</h4>
        <p>{{ .Site.Data.about.description_masa }} </p>

        <h6>Pofočkaj me na social</h6>
        <ul class="soicel-icon">

          <li> <a href="https://www.instagram.com/{{ .Site.Params.instaUsernameMasa }}" target="_blank"><i
                class="fa fa-instagram"></i></a>
          </li>
        </ul>
      </div>

    </div>
  </div>
</section>

{{ end }}
