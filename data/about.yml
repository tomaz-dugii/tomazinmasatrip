description: |
  Na pragu zrelosti, v pisarni, za ekranom do mraka, sva se velikokrat spraševala, kaj se skriva tako daleč za obzorjem. Želja po odkrivanju naju je gnala, da onstran domačih meja ozreva širni svet. Tako sva spakirala nahrbtnika, se poslovila od bližnjih, ter se z jutrom podala dogodivščinam naproti.
  
  Sva Maša in Tomaž, popotnika po obalah Tihega oceana. 

  Dobrodošli v najinem kotičku tega širnega interneta, kjer opisujeva svoja doživetja. Malo to počneva zase, malo za bližnje doma in malo za vsakega radovedneža, ki se slučajno znajde tukaj. 
  
  ***Končna destinacija je neznana. Dobrodošli na poti.***

description_tomaz: >
  Po rodu belokranjc z manjše družinske kmetije v metliški občini. 
  Poklicno software developer oz. programer in pred potovanjem zaposlen v Dhimahi, kjer sem programiral mobilne aplikacije. 
  V prostem času prostovoljni gasilec, ob priliki pa tudi ljubiteljski fotograf in snemalec. 
  Velik odvisnik od Čokolešnika. Trenutno preživljam veliko abstinenčno krizo.

description_masa: >
  S prelepe Savinjske doline, natančneje iz Celja. 
  Denar služim s vplejavo številk v marketing  in projektnim vodenjem. Nazadje sem oddelek marketinga vodila na podjetju SciNote. 
  Rada rišem, najraje z markerji, pogosto pa tudi berem in pišem krajše zapise. 
  Obožujem jagode, ki na Japonskem pridejo v vseh vrstah in oblikah. Žal pa me njihove cene velikokrat ustavijo pred vitrino.

